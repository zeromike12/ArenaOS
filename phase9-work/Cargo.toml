[package]
name = "arena-phase9-prototypes"
version = "0.1.0"
edition = "2024"
[dependencies]
arena-gfxkit = { path = "../userspace/gfxkit" }
arena-compositor-model = { path = "../userspace/compositord" }
[workspace]
[profile.release]
panic = "abort"
codegen-units = 1
opt-level = "s"
[[bin]]
name = "arena-compositord"
path = "compositord-main.rs"
[[bin]]
name = "arena-window-a"
path = "window-a.rs"
[[bin]]
name = "arena-window-b"
path = "window-b.rs"
