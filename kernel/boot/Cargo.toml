[package]
name = "arena-boot"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "ArenaOS boot stage — Milestone 1 kernel image (UEFI application)"

[dependencies]
# Zero third-party crates in the OS image (ADR-0004); workspace-internal
# crates only:
arena-heap = { path = "../libs/heap" }
arena-sync = { path = "../libs/sync" }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
