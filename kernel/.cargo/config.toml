# Default build target for the kernel workspace.
# Host-side unit tests (M2+) must pass --target x86_64-unknown-linux-gnu.
[build]
target = "x86_64-unknown-uefi"

# Deterministic PE image (Phase 11.5): lld-link otherwise stamps the link
# time into the COFF header and the debug directory, so relinking identical
# sources changed the EFI SHA-256 that qualification receipts record.
[target.x86_64-unknown-uefi]
rustflags = ["-C", "link-arg=/Brepro", "-C", "link-arg=/timestamp:0", "-C", "link-arg=/DEBUG:NONE"]
