# A bare-metal static ELF: x86_64-unknown-none (no std, no OS
# assumptions) linked by rust-lld with our own script so the layout
# matches ADR-0016's fixed addresses exactly — the same toolchain
# contract as every other userspace crate. Both binaries of this crate
# link with the same script; they never coexist in one address space,
# so sharing the 0x400000/0x410000 window is safe.
[build]
target = "x86_64-unknown-none"

[target.x86_64-unknown-none]
rustflags = ["-C", "link-arg=-Tnetstackd.ld", "-C", "link-arg=-no-pie", "-C", "relocation-model=static"]
