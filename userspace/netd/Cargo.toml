[package]
name = "arena-netd"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "ArenaOS network service (M6.1, ADR-0024) — the userspace virtio-net driver, link-layer only. Two images from one crate: `arena-netd` (spawn-registry image 6, the resident driver: virtio 1.0 handshake on a kernel-granted Mmio window, TWO split virtqueues — receiveq and transmitq — packed one-page-per-queue under CAP_SLOTS pressure, config-space MAC read, zero-copy TX through LENT buffer caps chained behind netd's own virtio header, RX buffers posted and harvested by MSI-X interrupts relayed into SYS_WAIT) and `nettest` (image 7, the m6 suite's ARP link-probe client: fetches the MAC, hand-builds a 42-byte ARP request for the slirp gateway, sends it through the service, and verifies the reply's protocol fields byte-for-byte)."

# Standalone project — deliberately NOT a member of the kernel workspace
# (different target, different profile rules). The empty table stops
# cargo from walking up into any parent workspace.
[workspace]

[profile.release]
panic = "abort"
codegen-units = 1
opt-level = "s"

# The network driver (registry image 6), spawned at boot when the
# virtio-net fixture is attached.
[[bin]]
name = "arena-netd"
path = "src/main.rs"

# The network-service test client (registry image 7), spawned only by
# the m6 suite's net_service test. Shares the userspace ABI surface
# (userspace/abi.rs) with every other image via #[path] — one wire
# contract, all programs.
[[bin]]
name = "nettest"
path = "src/nettest.rs"
