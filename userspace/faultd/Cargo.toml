[package]
name = "arena-faultd"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "ArenaOS fault-injection service (M6.5, ADR-0028) — the smallest possible IPC service, whose whole purpose is to DIE while holding a request. Two images from one crate: `arena-faultd` (spawn-registry image 14, a server with a PING that answers and a HANG that never does) and `faulttest` (image 15, the client that must receive a typed STATUS_SERVICE_GONE instead of waiting forever)."

# Standalone project — deliberately NOT a member of the kernel workspace.
[dependencies]
arena-lib = { path = "../arena-lib" }

[workspace]

[profile.release]
panic = "abort"
codegen-units = 1
opt-level = "s"

[[bin]]
name = "arena-faultd"
path = "src/main.rs"

[[bin]]
name = "faulttest"
path = "src/faulttest.rs"
