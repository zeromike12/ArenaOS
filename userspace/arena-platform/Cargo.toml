[package]
name = "arena-platform-core"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "ArenaOS-native bounded application metadata, signed APB1 verification, and registry model"

[workspace]

[dependencies]
arena-afs2 = { path = "../afs2" }
arena-phase84-crypto-audit = { path = "../../audit/phase84-crypto" }
arena-startup-abi = { path = "../arena-startup-abi" }

[profile.release]
panic = "abort"
codegen-units = 1
opt-level = "s"
