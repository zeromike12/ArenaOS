[package]
name = "arena-packaged"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "ADR-0053 receiver-verified signed package staging (never installation)"

[workspace]
[[bin]]
name = "arena-packaged"
path = "src/main.rs"

[dependencies]
arena-lib = { path = "../arena-lib" }
arena-platform-core = { path = "../arena-platform" }
arena-phase84-crypto-audit = { path = "../../audit/phase84-crypto" }

[lib]
path = "src/lib.rs"

[profile.release]
panic = "abort"
codegen-units = 1
opt-level = "s"
